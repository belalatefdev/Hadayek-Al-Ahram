name: Build Android APK with Expo EAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/eas-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Configure Expo preview environment
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli env:set --name EXPO_PUBLIC_SUPABASE_URL --value https://joziymewhmqtqrftblgp.supabase.co --environment preview --visibility plaintext --non-interactive
          npx eas-cli env:set --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value sb_publishable_XT7Q9bFXUmHAsjaP7RwJJQ_Wsq0iEsP --environment preview --visibility plaintext --non-interactive
      - name: Run Expo EAS Android build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive
